<style>
  .grid {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    width: 100%;
    margin: 0 auto;
  }

  .grid-item {
    width: 100% !important;
    min-width: 0;
    margin: 0 !important;
  }

  .grid-item img {
    display: block;
    width: 100%;
    max-width: none;
    height: auto;
  }

  .grid-item-content {
    padding: 15px;
    background: #f9f9f9;
    border: 1px solid #eee;
    border-top: none;
  }

  .grid-item-content h3 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: bold;
    color: #333;
    text-align: center;
  }

  @media (max-width: 768px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 480px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="grid">
  {% assign sorted = site.portfolio | sort: "date" | reverse %}
  {% for item in sorted %}
    <div class="grid-item">
      <a href="{{ item.url | relative_url }}">
        <img src="{{ item.img | relative_url }}" alt="{{ item.title }}">
      </a>

      <div class="grid-item-content">
        <h3>{{ item.title }}</h3>
      </div>
    </div>
  {% endfor %}
</div>
